<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情人节快乐！</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            font-family: 'Courier New', cursive;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 容器样式 */
        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* 标题样式 */
        h1 {
            color: #fff;
            font-size: 3.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        /* 心形照片框 */
        .heart-photo {
            width: 300px;
            height: 300px;
            background: #fff;
            border-radius: 50%;
            margin: 2rem auto;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .heart-photo:hover {
            transform: scale(1.05);
        }

        /* 情话样式 */
        .love-text {
            color: #fff;
            font-size: 1.5rem;
            margin: 1.5rem 0;
            line-height: 1.6;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        /* 按钮样式 */
        .love-button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .love-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }

        /* 动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* 飘落的心形 */
        .heart {
            position: absolute;
            color: #ff6b6b;
            font-size: 20px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    /* 在原有样式后添加 */
        .heart-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: all 0.3s;
            border: 5px solid #fff;
        }

        .memories-section {
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <audio id="bgm" loop autoplay>
    <source src="music.mp3" type="audio/mpeg">
    <source src="music.ogg" type="audio/ogg">
    您的浏览器不支持音频播放
    </audio>
    <div class="container">
        <h1>❤️ 情人节快乐！ ❤️</h1>
        
        <div class="heart-photo" onclick="showMessage()">
           <img src="couple-photo.jpg" alt="情人节快乐！" class="heart-img">
        </div>

        <div id="messages">
            <p class="love-text">你是我生命中最美的遇见</p>
            <p class="love-text" style="animation-delay: 0.5s">每一天都因你而甜蜜</p>
            <p class="love-text" style="animation-delay: 1s">愿我们永远相伴相守</p>
        </div>

        <button class="love-button" onclick="createHearts()">点击收获爱心</button>
    </div>

    <script>
        // 处理自动播放限制
        document.addEventListener('click', function() {
        const audio = document.getElementById('bgm');
        audio.play();
        }, { once: true }); // 只需要一次点击激活
        // 创建飘落的心形
        function createHearts() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // 显示隐藏消息
        function showMessage() {
            const messages = [
                "你的微笑是我的阳光",
                "执子之手，与子偕老",
                "爱你直到永远",
                "你让我的世界完整",
                "我的心里只有你"
            ];
            
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            alert(randomMsg);
        }

        // 自动生成爱心
        setInterval(() => {
            if (Math.random() > 0.7) createHearts();
        }, 300);

        // 添加点击特效
        document.addEventListener('click', function(e) {
            const x = e.pageX;
            const y = e.pageY;
            
            const star = document.createElement('div');
            star.style.left = x + 'px';
            star.style.top = y + 'px';
            star.classList.add('heart');
            star.innerHTML = '❤';
            star.style.animationDuration = '1s';
            document.body.appendChild(star);
            
            setTimeout(() => star.remove(), 1000);
        });
    </script>
</body>
</html>
